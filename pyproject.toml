[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simp-steganography"
version = "0.1.0"
description = "An image-carried multi-client messaging protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
simp = "simp.__main__:main"
simp-workbench = "simp.workbench:main"
simp-messenger = "simp.chat:main"
simp-relay = "simp.relay:main"

[tool.setuptools]
packages = ["simp"]

[tool.setuptools.package-data]
simp = ["assets/fonts/*", "assets/plates/*"]
